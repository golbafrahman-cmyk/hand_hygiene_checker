name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: flutter create --org com.handhygiene --project-name hand_hygiene_checker --platforms=android .

      - name: Set Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [Path('android/app/build.gradle'), Path('android/app/build.gradle.kts')]
          found = False
          for path in candidates:
              if path.exists():
                  text = path.read_text()
                  text = text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
                  text = text.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
                  path.write_text(text)
                  found = True
          if not found:
              raise SystemExit('Android app Gradle file not found')
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze application source
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hand-hygiene-ai-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
